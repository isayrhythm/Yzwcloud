[project]
name = "yzwcloud"
version = "0.1.0"
description = "Lightweight bioinformatics workflow cloud platform MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "openpyxl>=3.1.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.20",
    "scikit-learn>=1.5.0",
    "shap>=0.46.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.scripts]
dev = "uvicorn yzwcloud.main:app --reload --host 127.0.0.1 --port 8010"
start = "uvicorn yzwcloud.main:app --host 127.0.0.1 --port 8010"
start-bg = "python -m yzwcloud.dev_server start --port 8010"
stop-bg = "python -m yzwcloud.dev_server stop --port 8010"
restart-bg = "python -m yzwcloud.dev_server restart --port 8010"
clean-logs = "python -m yzwcloud.dev_server clean-logs --all-ports"
install-r = "Rscript src/yzwcloud/r/install_wgcna_packages.R"

[tool.pdm.build]
package-dir = "src"
includes = ["src/yzwcloud"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.0.3",
]
